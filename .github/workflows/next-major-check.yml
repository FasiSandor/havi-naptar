name: next-major build check

on:
  workflow_dispatch:
  push:
    branches:
      - next-major
    paths:
      - ".github/BUILD_CHECK_TRIGGER"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
